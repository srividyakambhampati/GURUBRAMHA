name: Build and deploy Node.js app to Azure Web App - gurubramha-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      - name: Install client dependencies
        run: npm install
        working-directory: ./client

      - name: Build React frontend
        run: npm run build
        working-directory: ./client

      - name: Copy frontend build to server/public
        run: |
          mkdir -p server/public
          cp -r client/dist/. server/public/
          echo "✅ Files copied to server/public:"
          ls server/public

      - name: Verify index.html exists
        run: |
          if [ ! -f server/public/index.html ]; then
            echo "❌ ERROR: index.html not found in server/public!"
            exit 1
          fi
          echo "✅ index.html found"

      - name: Install server dependencies (production only)
        run: npm install --omit=dev
        working-directory: ./server

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./server

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_42499F7D1EC44607A3C8F6DC31941368 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_F3A415F667DA4CEB919283B86B2430D9 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E21E1CE0B2064885A12772D9F3AA48BE }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gurubramha-api'
          slot-name: 'Production'
          package: .